<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ManagerReplay — Monitor</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #0b0f14; color-scheme: dark; }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 18px max(18px, env(safe-area-inset-left));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f14;
      color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
    .subtitle { color: #6b7280; font-size: 0.85rem; margin: 0 0 20px; line-height: 1.4; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      background: #111720;
      border: 1px solid #202833;
      border-radius: 14px;
      padding: 14px;
    }
    .card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 6px;
    }
    .card .value { font-size: 1.6rem; font-weight: 800; }
    .card .value.ok { color: #4ade80; }
    .card .value.warn { color: #f59e0b; }
    .card .value.bad { color: #dc2626; }
    #alerts { margin-top: 12px; }
    .alert {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid #dc2626;
      color: #f87171;
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 8px;
      font-size: 0.86rem;
      font-weight: 600;
    }
    #last-updated { font-size: 0.78rem; color: #6b7280; margin-top: 16px; }
    #error-banner {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid #dc2626;
      border-radius: 12px;
      padding: 1em;
      color: #f87171;
      font-size: 0.9em;
    }
    a.back-link {
      display: inline-flex;
      align-items: center;
      margin-top: 1.5em;
      color: #93c5fd;
      font-size: 0.87rem;
      font-weight: 600;
      text-decoration: none;
    }
    #refresh-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 13px;
      background: #2563eb;
      color: #fff;
    }
    #refresh-button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <h1>📊 Monitor da Pi</h1>
  <p class="subtitle">CPU, memória e temperatura medidas na hora — sem nada rodando em background</p>

  <div id="content"><p class="subtitle">Medindo...</p></div>
  <button id="refresh-button" type="button">🔄 Atualizar</button>
  <div id="last-updated"></div>
  <a class="back-link" href="index.html">&larr; voltar ao menu</a>

  <script>
    const contentEl = document.getElementById("content");
    const lastUpdatedEl = document.getElementById("last-updated");

    function cpuClass(pct) {
      if (pct >= 90) return "bad";
      if (pct >= 70) return "warn";
      return "ok";
    }

    function tempClass(temp) {
      if (temp >= 80) return "bad";
      if (temp >= 70) return "warn";
      return "ok";
    }

    function diskClass(pct) {
      if (pct >= 90) return "bad";
      if (pct >= 75) return "warn";
      return "ok";
    }

    function formatStorage(mb) {
      if (mb >= 1024) return `${(mb / 1024).toFixed(1)} GB`;
      return `${mb} MB`;
    }

    function render(status) {
      const ramPct = ((status.ram_used_mb / status.ram_total_mb) * 100).toFixed(0);
      const diskPct = ((status.disk_used_mb / status.disk_total_mb) * 100).toFixed(0);
      const alerts = [];
      if (status.undervoltage_now) alerts.push("⚠️ Subvoltagem ATIVA AGORA — fonte fraca, troque o carregador.");
      if (status.freq_capped_now || status.throttled_now) alerts.push("⚠️ CPU sendo limitada agora por energia/temperatura.");
      if (status.undervoltage_ever) alerts.push("ℹ️ Já ocorreu subvoltagem desde que a Pi ligou.");

      contentEl.innerHTML = `
        <div class="grid">
          <div class="card">
            <div class="label">CPU</div>
            <div class="value ${cpuClass(status.cpu_pct)}">${status.cpu_pct.toFixed(1)}%</div>
          </div>
          <div class="card">
            <div class="label">Temperatura</div>
            <div class="value ${tempClass(status.temp_c)}">${status.temp_c.toFixed(1)}°C</div>
          </div>
          <div class="card">
            <div class="label">RAM</div>
            <div class="value">${status.ram_used_mb} MB<br /><span style="font-size:0.5em;color:#999;">de ${status.ram_total_mb} MB (${ramPct}%)</span></div>
          </div>
          <div class="card">
            <div class="label">Clock CPU / GPU</div>
            <div class="value" style="font-size:1.1em;">${status.arm_clock_mhz} / ${status.core_clock_mhz} MHz</div>
          </div>
          <div class="card" style="grid-column: 1 / -1;">
            <div class="label">Armazenamento</div>
            <div class="value ${diskClass(diskPct)}">${formatStorage(status.disk_used_mb)}<br /><span style="font-size:0.5em;color:#999;">de ${formatStorage(status.disk_total_mb)} (${diskPct}%)</span></div>
          </div>
        </div>
        <div id="alerts">${alerts.map((a) => `<div class="alert">${a}</div>`).join("")}</div>
      `;
      lastUpdatedEl.textContent = `Última leitura: ${status.timestamp}`;
    }

    const refreshButtonEl = document.getElementById("refresh-button");

    async function measure() {
      refreshButtonEl.disabled = true;
      refreshButtonEl.textContent = "Medindo...";
      try {
        const response = await fetch("/monitor-status");
        if (!response.ok) throw new Error("não foi possível medir agora");
        const status = await response.json();
        render(status);
      } catch (err) {
        contentEl.innerHTML = `<div id="error-banner">Não foi possível ler o status: ${err.message}</div>`;
      } finally {
        refreshButtonEl.disabled = false;
        refreshButtonEl.textContent = "🔄 Atualizar";
      }
    }

    refreshButtonEl.addEventListener("click", measure);
    measure();
  </script>
</body>
</html>
