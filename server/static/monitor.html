<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ManagerReplay — Monitor</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card { padding: 14px; }
    .stat-card .label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .stat-card .label .icon { color: var(--accent); }
    .stat-card .value { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-card .value .value-detail { font-size: 0.5em; color: var(--text-muted); font-weight: 600; }
    .stat-card .value.ok { color: var(--success); }
    .stat-card .value.warn { color: var(--warning-hover); }
    .stat-card .value.bad { color: var(--danger); }

    .capacity-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.86rem;
    }
    .capacity-row + .capacity-row {
      border-top: 1px solid var(--border);
    }
    .capacity-row .capacity-label { font-weight: 700; color: var(--text-secondary); }
    .capacity-row .capacity-value { font-weight: 800; font-variant-numeric: tabular-nums; }
    .capacity-note { margin-top: 8px; font-size: 0.74rem; color: var(--text-muted); line-height: 1.4; }

    .storage-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
    }
    .storage-option + .storage-option {
      border-top: 1px solid var(--border);
    }
    .storage-option input[type="radio"] {
      flex: none;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .storage-option-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .storage-option-label { font-size: 0.86rem; font-weight: 700; overflow-wrap: break-word; }
    .storage-option.selected .storage-option-label { color: var(--accent); }
    .storage-option-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }

    .storage-select-button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .storage-select-button:disabled {
      background: var(--border-strong);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    #alerts { margin-top: 12px; }
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      margin-bottom: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .alert .icon { flex: none; margin-top: 0.15em; }
    .alert.info { background: var(--accent-soft); border-color: #c7d2fe; color: #3730a3; }

    #last-updated { font-size: 0.78rem; color: var(--text-muted); margin-top: 16px; }

    #error-banner {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      border-radius: var(--radius-sm);
      padding: 1em;
      color: #991b1b;
      font-size: 0.9em;
    }

    #refresh-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      font-size: 0.98rem;
      font-weight: 800;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.3);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    #refresh-button:active { background: var(--accent-hover); transform: scale(0.98); }
    #refresh-button:disabled { opacity: 0.6; box-shadow: none; }
    #refresh-button .icon.spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="icon-button" href="index.html" aria-label="Voltar">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </span>
        ManagerReplay
      </div>
    </header>

    <h1 class="page-title">
      <svg class="icon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Monitor da Pi
    </h1>
    <p class="subtitle">CPU, memória e temperatura medidas na hora — sem nada rodando em background.</p>

    <div id="content"><p class="subtitle">Medindo...</p></div>
    <button id="refresh-button" type="button">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      <span id="refresh-button-label">Atualizar</span>
    </button>
    <div id="last-updated"></div>

  </div>

  <script>
    const contentEl = document.getElementById("content");
    const lastUpdatedEl = document.getElementById("last-updated");

    const ICON_ALERT = '<svg class="icon" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
    const ICON_INFO = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
    const ICON_CLOCK = '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';

    // MB/min medidos/estimados por qualidade — não são valores teóricos de
    // configuração de bitrate, vêm de um teste real de gravação (16.77 MB em
    // 70s ≈ 14.4 MB/min em HD·30fps, ver README/histórico do projeto). FHD é
    // estimado pela proporção de pixels em relação ao HD (2.25x), não medido
    // diretamente — pode variar bastante conforme a cena.
    const RECORDING_MB_PER_MINUTE = {
      hd30: 14.4,
      fhd30: 14.4 * 2.25,
    };

    function formatDurationEstimate(totalMinutes) {
      if (!isFinite(totalMinutes) || totalMinutes <= 0) return "0 min";
      const hours = Math.floor(totalMinutes / 60);
      const minutes = Math.round(totalMinutes % 60);
      if (hours === 0) return `${minutes} min`;
      return `${hours}h ${String(minutes).padStart(2, "0")}min`;
    }

    function cpuClass(pct) {
      if (pct >= 90) return "bad";
      if (pct >= 70) return "warn";
      return "ok";
    }

    function tempClass(temp) {
      if (temp >= 80) return "bad";
      if (temp >= 70) return "warn";
      return "ok";
    }

    function diskClass(pct) {
      if (pct >= 90) return "bad";
      if (pct >= 75) return "warn";
      return "ok";
    }

    function formatStorage(mb) {
      if (mb >= 1024) return `${(mb / 1024).toFixed(1)} GB`;
      return `${mb} MB`;
    }

    const ICON_DRIVE = '<svg class="icon" viewBox="0 0 24 24"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>';

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[ch]);
    }

    async function fetchStorageOptions() {
      const response = await fetch("/storage-options");
      if (!response.ok) throw new Error("não foi possível ler os locais de gravação");
      return response.json();
    }

    function renderStorageSelector(storageOptions) {
      const rows = storageOptions.options.map((opt) => {
        const isCurrent = opt.path === storageOptions.current;
        return `
          <label class="storage-option ${isCurrent ? "selected" : ""}">
            <input type="radio" name="storage-choice" value="${escapeHtml(opt.path)}" ${isCurrent ? "checked" : ""} />
            <span class="storage-option-body">
              <span class="storage-option-label">${escapeHtml(opt.label)}${isCurrent ? " — em uso" : ""}</span>
              <span class="storage-option-meta">${formatStorage(opt.disk_free_mb)} livres de ${formatStorage(opt.disk_total_mb)}</span>
            </span>
          </label>
        `;
      }).join("");

      return `
        <div class="card stat-card" style="margin-top: 10px;">
          <div class="label">${ICON_DRIVE} Local de gravação</div>
          <div id="storage-options-list">${rows}</div>
          <button id="storage-select-button" type="button" class="storage-select-button" disabled>Usar este local</button>
          <div id="storage-select-message" class="capacity-note"></div>
        </div>
      `;
    }

    function attachStorageSelectorListeners(storageOptions) {
      const listEl = document.getElementById("storage-options-list");
      const selectButtonEl = document.getElementById("storage-select-button");
      const messageEl = document.getElementById("storage-select-message");
      if (!listEl || !selectButtonEl) return;

      listEl.addEventListener("change", () => {
        const chosen = listEl.querySelector("input[name='storage-choice']:checked");
        selectButtonEl.disabled = !chosen || chosen.value === storageOptions.current;
      });

      selectButtonEl.addEventListener("click", async () => {
        const chosen = listEl.querySelector("input[name='storage-choice']:checked");
        if (!chosen) return;
        selectButtonEl.disabled = true;
        messageEl.textContent = "Trocando...";
        try {
          const response = await fetch(`/storage-select?path=${encodeURIComponent(chosen.value)}`, { method: "POST" });
          if (response.status === 409) {
            messageEl.textContent = "Não dá pra trocar com uma câmera gravando agora.";
            selectButtonEl.disabled = false;
            return;
          }
          if (!response.ok) throw new Error("não foi possível trocar o local de gravação");
          messageEl.textContent = "Local de gravação atualizado.";
          measure();
        } catch (err) {
          messageEl.textContent = `Erro: ${err.message}`;
          selectButtonEl.disabled = false;
        }
      });
    }

    function render(status, storageOptions) {
      const ramPct = ((status.ram_used_mb / status.ram_total_mb) * 100).toFixed(0);
      const diskPct = ((status.disk_used_mb / status.disk_total_mb) * 100).toFixed(0);
      const freeMb = Math.max(0, status.disk_total_mb - status.disk_used_mb);
      const hdMinutesLeft = freeMb / RECORDING_MB_PER_MINUTE.hd30;
      const fhdMinutesLeft = freeMb / RECORDING_MB_PER_MINUTE.fhd30;
      const alerts = [];
      if (status.undervoltage_now) alerts.push({ icon: ICON_ALERT, tone: "", text: "Subvoltagem ATIVA AGORA — fonte fraca, troque o carregador." });
      if (status.freq_capped_now || status.throttled_now) alerts.push({ icon: ICON_ALERT, tone: "", text: "CPU sendo limitada agora por energia/temperatura." });
      if (status.undervoltage_ever) alerts.push({ icon: ICON_INFO, tone: "info", text: "Já ocorreu subvoltagem desde que a Pi ligou." });

      contentEl.innerHTML = `
        <div class="grid">
          <div class="card stat-card">
            <div class="label">CPU</div>
            <div class="value ${cpuClass(status.cpu_pct)}">${status.cpu_pct.toFixed(1)}%</div>
          </div>
          <div class="card stat-card">
            <div class="label">Temperatura</div>
            <div class="value ${tempClass(status.temp_c)}">${status.temp_c.toFixed(1)}°C</div>
          </div>
          <div class="card stat-card">
            <div class="label">RAM</div>
            <div class="value">${status.ram_used_mb} MB<br /><span class="value-detail">de ${status.ram_total_mb} MB (${ramPct}%)</span></div>
          </div>
          <div class="card stat-card">
            <div class="label">Clock CPU / GPU</div>
            <div class="value" style="font-size:1.1em;">${status.arm_clock_mhz} / ${status.core_clock_mhz} MHz</div>
          </div>
          <div class="card stat-card" style="grid-column: 1 / -1;">
            <div class="label">Armazenamento</div>
            <div class="value ${diskClass(diskPct)}">${formatStorage(status.disk_used_mb)}<br /><span class="value-detail">de ${formatStorage(status.disk_total_mb)} (${diskPct}%)</span></div>
          </div>
        </div>

        <div class="card stat-card" style="margin-top: 10px;">
          <div class="label">${ICON_CLOCK} Tempo de gravação restante</div>
          <div class="capacity-row">
            <span class="capacity-label">HD · 30fps</span>
            <span class="capacity-value">${formatDurationEstimate(hdMinutesLeft)}</span>
          </div>
          <div class="capacity-row">
            <span class="capacity-label">FHD · 30fps</span>
            <span class="capacity-value">${formatDurationEstimate(fhdMinutesLeft)}</span>
          </div>
          <div class="capacity-note">Estimativa a partir do espaço livre (${formatStorage(freeMb)}) e da taxa média observada — pode variar conforme a cena gravada.</div>
        </div>

        ${renderStorageSelector(storageOptions)}

        <div id="alerts">${alerts.map((a) => `<div class="alert ${a.tone}">${a.icon}<span>${a.text}</span></div>`).join("")}</div>
      `;
      lastUpdatedEl.textContent = `Última leitura: ${status.timestamp}`;
      attachStorageSelectorListeners(storageOptions);
    }

    const refreshButtonEl = document.getElementById("refresh-button");
    const refreshButtonLabelEl = document.getElementById("refresh-button-label");
    const refreshButtonIconEl = refreshButtonEl.querySelector(".icon");

    async function measure() {
      refreshButtonEl.disabled = true;
      refreshButtonLabelEl.textContent = "Medindo...";
      refreshButtonIconEl.classList.add("spin");
      try {
        const [statusResponse, storageOptions] = await Promise.all([
          fetch("/monitor-status"),
          fetchStorageOptions(),
        ]);
        if (!statusResponse.ok) throw new Error("não foi possível medir agora");
        const status = await statusResponse.json();
        render(status, storageOptions);
      } catch (err) {
        contentEl.innerHTML = `<div id="error-banner">Não foi possível ler o status: ${err.message}</div>`;
      } finally {
        refreshButtonEl.disabled = false;
        refreshButtonLabelEl.textContent = "Atualizar";
        refreshButtonIconEl.classList.remove("spin");
      }
    }

    refreshButtonEl.addEventListener("click", measure);
    measure();
  </script>
</body>
</html>
