<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ManagerReplay — Arquivos</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    #breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      word-break: break-word;
    }
    #breadcrumb a { color: var(--accent); text-decoration: none; font-weight: 600; }

    .entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      margin-bottom: 9px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s ease;
    }
    .entry:active { transform: scale(0.99); }

    .entry-icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .entry-icon.tone-folder { background: var(--accent-soft); color: var(--accent); }
    .entry-icon.tone-file { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }

    .entry-body { min-width: 0; flex: 1; }
    .entry-name { font-size: 0.98rem; font-weight: 700; overflow-wrap: break-word; }
    .entry-meta { font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; }

    .entry-action {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .entry-chevron { color: var(--text-muted); flex-shrink: 0; }

    #empty {
      color: var(--text-muted);
      text-align: center;
      padding: 2.5em 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="icon-button" href="index.html" aria-label="Voltar">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </span>
        ManagerReplay
      </div>
    </header>

    <h1 class="page-title">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      Arquivos
    </h1>

    <div id="breadcrumb"></div>
    <div id="listing"></div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const currentPath = params.get("path") || "";

    const ICON_FOLDER = '<svg class="icon" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
    const ICON_CALENDAR = '<svg class="icon" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>';
    const ICON_CHEVRON = '<svg class="icon entry-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
    const ICON_DOWNLOAD = '<svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';
    const ICON_VIDEO = '<svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>';

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[ch]);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function formatDate(mtimeSeconds) {
      const d = new Date(mtimeSeconds * 1000);
      return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    // Estimado a partir do número de pedaços de 30s (ver file_listing.py) —
    // não é um corte exato, por isso o "≈".
    function formatDuration(durationSeconds) {
      if (durationSeconds == null) return null;
      const minutes = Math.floor(durationSeconds / 60);
      const seconds = durationSeconds % 60;
      return `≈${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function renderBreadcrumb() {
      const breadcrumbEl = document.getElementById("breadcrumb");
      const parts = currentPath.split("/").filter(Boolean);
      let html = '<a href="files.html?path=">arquivos</a>';
      let accPath = "";
      for (const part of parts) {
        accPath += (accPath ? "/" : "") + part;
        html += ` <span>/</span> <a href="files.html?path=${encodeURIComponent(accPath)}">${escapeHtml(part)}</a>`;
      }
      breadcrumbEl.innerHTML = html;
    }

    const DAY_FOLDER_PATTERN = /^(\d{4})-(\d{2})-(\d{2})$/;

    function formatFolderLabel(name) {
      const match = name.match(DAY_FOLDER_PATTERN);
      if (!match) return escapeHtml(name);
      const [, year, month, day] = match;
      return `Replay do dia ${day}/${month}/${year}`;
    }

    function renderEntry(entry) {
      const childPath = currentPath ? `${currentPath}/${entry.name}` : entry.name;
      if (entry.is_dir) {
        const isDayFolder = DAY_FOLDER_PATTERN.test(entry.name);
        const a = document.createElement("a");
        a.className = "entry card";
        a.href = `files.html?path=${encodeURIComponent(childPath)}`;
        a.innerHTML = `
          <div class="entry-icon tone-folder">${isDayFolder ? ICON_CALENDAR : ICON_FOLDER}</div>
          <div class="entry-body">
            <div class="entry-name">${formatFolderLabel(entry.name)}</div>
            <div class="entry-meta">pasta</div>
          </div>
          ${ICON_CHEVRON}
        `;
        return a;
      }
      const duration = formatDuration(entry.duration_seconds);
      const meta = [formatBytes(entry.size), duration, formatDate(entry.mtime)].filter(Boolean).join(" · ");

      const a = document.createElement("a");
      a.className = "entry card";
      a.href = `/files/${childPath}`;
      a.download = entry.name;
      a.innerHTML = `
        <div class="entry-icon tone-file">${ICON_VIDEO}</div>
        <div class="entry-body">
          <div class="entry-name">${escapeHtml(entry.name)}</div>
          <div class="entry-meta">${meta}</div>
        </div>
        <div class="entry-action">${ICON_DOWNLOAD} Baixar</div>
      `;
      return a;
    }

    async function load() {
      renderBreadcrumb();
      const listingEl = document.getElementById("listing");
      try {
        const response = await fetch(`/files-list?path=${encodeURIComponent(currentPath)}`);
        if (!response.ok) throw new Error("não encontrado");
        const entries = await response.json();
        if (entries.length === 0) {
          listingEl.innerHTML = '<div id="empty">Nenhuma gravação ainda.</div>';
          return;
        }
        entries.forEach((entry) => listingEl.appendChild(renderEntry(entry)));
      } catch (err) {
        listingEl.innerHTML = `<div id="empty">erro: ${escapeHtml(err.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
