<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ManagerReplay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 1em;
      min-height: 100vh;
    }
    #video-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video {
      width: 100%;
      display: block;
      position: absolute;
      inset: 0;
      object-fit: cover;
      height: 100%;
    }
    #video-wrap { aspect-ratio: 9 / 12; }
    .overlay-row {
      position: relative;
      z-index: 1;
      padding: 12px;
    }
    #rec-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 0.8em;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
    }
    #rec-badge[hidden] { display: none; }
    #operator-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(22, 163, 74, 0.9);
      color: #fff;
      font-size: 0.8em;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 6px;
    }
    #rec-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      padding-top: 30px;
    }
    #camera-settings {
      display: flex;
      gap: 10px;
      margin-top: 0.75em;
    }
    .settings-field { flex: 1; }
    .settings-field label {
      display: block;
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      margin-bottom: 0.4em;
    }
    .settings-field select {
      appearance: none;
      display: block;
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #eee;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9em;
    }
    .settings-field select:focus { outline: none; border-color: #16a34a; }
    .settings-field select:disabled { opacity: 0.5; }
    #record-toggle {
      flex-shrink: 0;
      padding: 14px 24px;
      font-size: 1.15em;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      background: #16a34a;
      color: #fff;
    }
    #record-toggle:active { background: #15803d; }
    #record-toggle.recording {
      background: #dc2626;
      color: #fff;
    }
    #record-toggle.recording:active { background: #b91c1c; }
    #lance-button {
      display: block;
      width: 100%;
      margin-top: 0.75em;
      padding: 14px 24px;
      font-size: 1.15em;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      background: #f59e0b;
      color: #111;
    }
    #lance-button[hidden] { display: none; }
    #lance-button:active { background: #d97706; }
    #lance-button:disabled {
      background: #444;
      color: #999;
    }
    @keyframes flash-pulse {
      0% { box-shadow: inset 0 0 0 6px rgba(245, 158, 11, 0.9); }
      100% { box-shadow: inset 0 0 0 6px rgba(245, 158, 11, 0); }
    }
    #video-wrap.flash { animation: flash-pulse 0.5s ease-out; }
    #lance-toast, #save-toast {
      text-align: center;
      margin-top: 0.6em;
      font-weight: 600;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #lance-toast { color: #f59e0b; }
    #save-toast { color: #4ade80; }
    #lance-toast.visible, #save-toast.visible { opacity: 1; }
    details {
      margin-top: 0.75em;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 0.6em 1em;
    }
    summary {
      cursor: pointer;
      color: #93c5fd;
      font-size: 0.9em;
    }
    #status { color: #4ade80; font-weight: 600; margin-top: 0.5em; }
    #stats, #save-path { font-size: 0.85em; color: #999; margin-top: 0.3em; word-break: break-all; }
    a.back-link {
      display: inline-block;
      margin-top: 0.75em;
      color: #93c5fd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="video-wrap">
    <video id="preview" autoplay playsinline muted></video>
    <div class="overlay-row">
      <span id="rec-badge" hidden><span class="dot"></span> gravando · <span id="elapsed">00:00</span></span>
      <br />
      <span id="operator-badge" hidden>🎥 <span id="operator-name"></span></span>
    </div>
    <div class="overlay-row bottom-controls">
      <button id="record-toggle" type="button">● Iniciar gravação</button>
    </div>
  </div>
  <div id="camera-settings">
    <div class="settings-field">
      <label for="camera-device">📷 Câmera</label>
      <select id="camera-device"></select>
    </div>
    <div class="settings-field">
      <label for="quality-select">🎞️ Qualidade</label>
      <select id="quality-select">
        <option value="hd30">HD · 30fps</option>
        <option value="hd60">HD · 60fps</option>
        <option value="fhd30">FHD · 30fps</option>
        <option value="fhd60">FHD · 60fps</option>
      </select>
    </div>
  </div>
  <button id="lance-button" type="button" hidden>⚡ Lance</button>
  <div id="lance-toast"></div>
  <div id="save-toast"></div>
  <details>
    <summary>⚙ detalhes técnicos</summary>
    <div id="status">iniciando...</div>
    <div id="stats"></div>
    <div id="save-path"></div>
  </details>
  <a class="back-link" href="cameras.html">&larr; voltar ao menu</a>
  <script src="client.js?v=15"></script>
</body>
</html>
