<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <title>ManagerReplay</title>

  <link rel="stylesheet" href="theme.css" />

  <style>
    /* Tokens, reset, .icon/.icon-fill, .card, .icon-button e foco vêm de theme.css */

    body {
      min-width: 100%;
    }


    /* =========================================================
       APP
       ========================================================= */

    .app {
      width: 100%;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    /* =========================================================
       TOPBAR (base em theme.css)
       ========================================================= */

    .topbar {
      padding: 14px 16px 6px;
      margin-bottom: 0;
    }


    /* =========================================================
       VIDEO
       ========================================================= */

    #video-wrap {
      position: relative;

      width: 100%;
      margin: 8px 0 0;

      /*
       * Um pouco mais baixo que 9:16.
       * Evita que o vídeo consuma a tela inteira no celular.
       */
      aspect-ratio: 4 / 5;

      background: #0f172a;

      overflow: hidden;

      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);

      isolation: isolate;
    }

    #preview {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #0f172a;

      object-fit: cover;
    }


    /* =========================================================
       VIDEO TOP
       ========================================================= */

    .video-top {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;

      padding:
        max(14px, env(safe-area-inset-top))
        14px
        36px
        14px;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0)
        );
    }


    /* =========================================================
       VIDEO BOTTOM
       ========================================================= */

    .video-bottom {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2;

      padding:
        55px
        16px
        max(16px, env(safe-area-inset-bottom))
        16px;

      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, 0.82),
          rgba(0, 0, 0, 0)
        );
    }


    /* =========================================================
       BADGES
       ========================================================= */

    .badge {
      display: inline-flex;

      align-items: center;
      gap: 7px;

      width: fit-content;

      padding: 7px 12px 7px 10px;

      border-radius: 999px;

      color: #fff;

      font-size: 0.76rem;
      font-weight: 700;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .badge[hidden] {
      display: none;
    }

    .badge-rec {
      background: rgba(220, 38, 38, 0.94);
    }

    .badge-rec .dot {
      width: 8px;
      height: 8px;

      flex: 0 0 8px;

      border-radius: 50%;

      background: #fff;

      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .badge-operator {
      background: rgba(22, 163, 74, 0.94);
    }

    .badge-operator .icon {
      width: 0.95em;
      height: 0.95em;
    }


    /* =========================================================
       BOTÕES
       ========================================================= */

    .btn {
      display: flex;

      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;

      border: 0;
      border-radius: var(--radius-md);

      cursor: pointer;

      transition:
        transform 0.12s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn .icon {
      width: 1.15em;
      height: 1.15em;
    }


    /* =========================================================
       GRAVAR
       ========================================================= */

    #record-toggle {
      min-height: 60px;

      padding: 14px 20px;

      background: var(--accent);
      color: #fff;

      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -0.01em;

      box-shadow:
        0 10px 26px rgba(79, 70, 229, 0.35);
    }

    #record-toggle:active {
      background: var(--accent-hover);
    }

    #record-toggle .record-icon-active {
      display: none;
    }

    #record-toggle.recording {
      background: var(--danger);

      box-shadow:
        0 10px 26px rgba(220, 38, 38, 0.35);
    }

    #record-toggle.recording:active {
      background: var(--danger-hover);
    }

    #record-toggle.recording .record-icon-idle {
      display: none;
    }

    #record-toggle.recording .record-icon-active {
      display: inline-block;
    }


    /* =========================================================
       PAINEL
       ========================================================= */

    .side-panel {
      width: 100%;

      display: flex;
      flex-direction: column;
      gap: 10px;

      padding: 16px 16px 20px;
    }


    /* =========================================================
       CONFIGURAÇÕES
       ========================================================= */

    .settings-card {
      padding: 16px;
    }

    #camera-settings {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin: 0;
    }

    .settings-field {
      min-width: 0;
    }

    .settings-field label {
      display: flex;
      align-items: center;
      gap: 6px;

      margin-bottom: 8px;

      color: var(--text-secondary);

      font-size: 0.72rem;
      font-weight: 800;

      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-field label .icon {
      color: var(--accent);
    }

    .settings-field select {
      appearance: none;

      width: 100%;
      min-height: 50px;

      padding: 0 34px 0 13px;

      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);

      background-color: #f8fafc;
      color: var(--text);

      font-size: 0.87rem;
      font-weight: 600;

      cursor: pointer;

      background-image:
        linear-gradient(
          45deg,
          transparent 50%,
          #64748b 50%
        ),
        linear-gradient(
          135deg,
          #64748b 50%,
          transparent 50%
        );

      background-position:
        calc(100% - 15px) 21px,
        calc(100% - 10px) 21px;

      background-size:
        5px 5px,
        5px 5px;

      background-repeat: no-repeat;

      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .settings-field select:focus {
      outline: none;

      border-color: var(--accent);

      box-shadow:
        0 0 0 3px var(--accent-soft);
    }

    .settings-field select:disabled {
      opacity: 0.5;
    }


    /* =========================================================
       LANCE
       ========================================================= */

    #lance-button {
      min-height: 58px;

      padding: 13px 20px;

      background: var(--warning);
      color: var(--warning-ink);

      font-size: 1.02rem;
      font-weight: 900;

      box-shadow:
        0 10px 24px rgba(245, 158, 11, 0.3);
    }

    #lance-button[hidden] {
      display: none;
    }

    #lance-button:active {
      background: var(--warning-hover);
    }

    #lance-button:disabled {
      background: #e2e8f0;
      color: var(--text-muted);

      box-shadow: none;

      cursor: not-allowed;
    }


    /* =========================================================
       TOASTS
       ========================================================= */

    .toast {
      display: flex;
      align-items: center;
      gap: 7px;

      max-height: 0;
      overflow: hidden;

      padding: 0 2px;

      font-size: 0.84rem;
      font-weight: 700;

      opacity: 0;

      transition: opacity 0.2s ease, max-height 0.2s ease;
    }

    .toast .icon {
      flex: none;
    }

    #lance-toast {
      color: var(--warning-hover);
    }

    #save-toast {
      color: var(--success);
    }

    .toast.visible {
      max-height: 28px;
      opacity: 1;
    }


    /* =========================================================
       DETALHES
       ========================================================= */

    details {
      overflow: hidden;
    }

    summary {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 50px;

      padding: 0 14px;

      color: var(--text-secondary);

      font-size: 0.86rem;
      font-weight: 700;

      cursor: pointer;

      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary .icon-settings {
      color: var(--accent);
    }

    summary .icon-chevron {
      margin-left: auto;

      transition: transform 0.2s ease;
    }

    details[open] summary .icon-chevron {
      transform: rotate(180deg);
    }

    #status,
    #camera-info,
    #stats,
    #transfer-stats,
    #save-path {
      padding-left: 14px;
      padding-right: 14px;
    }

    #status {
      padding-top: 4px;

      color: var(--success);

      font-size: 0.82rem;
      font-weight: 700;
    }

    #camera-info,
    #stats,
    #transfer-stats,
    #save-path {
      margin-top: 6px;

      color: var(--text-muted);

      font-size: 0.76rem;

      word-break: break-word;
    }

    #save-path {
      padding-bottom: 14px;
    }


    /* =========================================================
       FLASH
       ========================================================= */

    @keyframes flash-pulse {
      0% {
        box-shadow:
          inset 0 0 0 6px
          rgba(245, 158, 11, 0.95);
      }

      100% {
        box-shadow:
          inset 0 0 0 6px
          rgba(245, 158, 11, 0);
      }
    }

    #video-wrap.flash {
      animation: flash-pulse 0.5s ease-out;
    }


    /* =========================================================
       CELULARES PEQUENOS
       ========================================================= */

    @media (max-width: 380px) {
      #video-wrap {
        aspect-ratio: 4 / 5;
      }

      .side-panel {
        padding-left: 12px;
        padding-right: 12px;
      }

      #camera-settings {
        gap: 8px;
      }

      .settings-field select {
        font-size: 0.79rem;
        padding-left: 10px;
      }

      #record-toggle {
        min-height: 54px;
      }
    }


    /* =========================================================
       LANDSCAPE NO CELULAR
       ========================================================= */

    @media (
      orientation: landscape
    ) and (
      max-height: 600px
    ) {

      .app {
        min-height: 100dvh;

        padding:
          max(8px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }

      .topbar {
        padding: 2px 4px 8px;
      }

      .app-body {
        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          minmax(240px, 34%);

        gap: 12px;
      }

      #video-wrap {
        margin: 0;

        height: calc(
          100dvh
          - env(safe-area-inset-top)
          - env(safe-area-inset-bottom)
          - 46px
        );

        aspect-ratio: auto;

        border-radius: 14px;
      }

      .side-panel {
        height: 100%;

        padding: 0;

        overflow-y: auto;
        overscroll-behavior: contain;
      }

      #camera-settings {
        grid-template-columns: 1fr;
      }

      #record-toggle {
        min-height: 52px;
      }
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (min-width: 600px) {

      .app {
        max-width: 900px;

        margin: 0 auto;

        padding:
          20px
          max(20px, env(safe-area-inset-right))
          20px
          max(20px, env(safe-area-inset-left));
      }

      .topbar {
        padding: 0 2px 14px;
      }

      #video-wrap {
        margin: 0;

        aspect-ratio: 16 / 10;

        border-radius: var(--radius-lg);
      }

      .side-panel {
        padding:
          16px
          0
          0;
      }

      #camera-settings {
        grid-template-columns: 1fr 1fr;
      }
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 900px) {

      .app {
        max-width: 1140px;
      }

      .app-body {
        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          340px;

        align-items: start;

        gap: 22px;
      }

      #video-wrap {
        aspect-ratio: 16 / 10;
        border-radius: var(--radius-lg);
      }

      .side-panel {
        padding: 0;
      }

      #camera-settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =====================================================
         MARCA
         ===================================================== -->

    <header class="topbar">
      <a class="icon-button" href="cameras.html" aria-label="Voltar">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </span>
        ManagerReplay
      </div>
    </header>

    <div class="app-body">

      <!-- =====================================================
           CÂMERA
           ===================================================== -->

      <section id="video-wrap">

        <video
          id="preview"
          autoplay
          playsinline
          muted
        ></video>

        <!-- Informações sobre gravação -->
        <div class="video-top">

          <span id="rec-badge" class="badge badge-rec" hidden>
            <span class="dot"></span>

            gravando ·

            <span id="elapsed">
              00:00
            </span>
          </span>

          <span id="operator-badge" class="badge badge-operator" hidden>
            <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>

            <span id="operator-name"></span>
          </span>

        </div>


        <!-- Botão principal -->
        <div class="video-bottom">

          <button
            id="record-toggle"
            type="button"
            class="btn"
          >
            <svg class="icon icon-fill record-icon-idle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
            <svg class="icon icon-fill record-icon-active" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>

            <span id="record-toggle-label">Iniciar gravação</span>
          </button>

        </div>

      </section>


      <!-- =====================================================
           PAINEL DE CONTROLE
           ===================================================== -->

      <section class="side-panel">

        <div class="card settings-card">

          <div id="camera-settings">

            <!-- Câmera -->
            <div class="settings-field">

              <label for="camera-device">
                <svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                Câmera
              </label>

              <select id="camera-device"></select>

            </div>


            <!-- Qualidade -->
            <div class="settings-field">

              <label for="quality-select">
                <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
                Qualidade
              </label>

              <select id="quality-select"></select>

            </div>

          </div>

        </div>


        <!-- Lance -->
        <button
          id="lance-button"
          type="button"
          class="btn"
          hidden
        >
          <svg class="icon icon-fill" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>

          <span id="lance-button-label">Lance</span>
        </button>


        <!-- Mensagens -->
        <div id="lance-toast" class="toast"></div>

        <div id="save-toast" class="toast">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          <span id="save-toast-label"></span>
        </div>


        <!-- Detalhes -->
        <details class="card">

          <summary>
            <svg class="icon icon-settings" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
            Detalhes técnicos
            <svg class="icon icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </summary>

          <div id="status">
            iniciando...
          </div>

          <div id="camera-info"></div>

          <div id="stats"></div>

          <div id="transfer-stats"></div>

          <div id="save-path"></div>

        </details>

      </section>

    </div>

  </main>


  <script src="client.js?v=28"></script>

</body>
</html>
