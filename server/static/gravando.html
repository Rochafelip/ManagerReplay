<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ManagerReplay — Quem está gravando</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .rec-card { padding: 15px 16px; margin-bottom: 12px; }
    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .card-name { font-size: 1.08rem; font-weight: 800; }
    .card-camera { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
    .card-camera .icon { color: var(--accent); }
    .card-elapsed {
      font-size: 1.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--danger);
      margin-top: 4px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .signal { display: flex; align-items: center; gap: 5px; font-weight: 700; flex-shrink: 0; }
    .signal .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .signal.ok { color: var(--success); }
    .signal.ok .dot { background: var(--success); animation: pulse 1.2s infinite; }
    .signal.bad { color: var(--danger); }
    .signal.bad .dot { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    #empty { color: var(--text-muted); text-align: center; padding: 2.5em 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="icon-button" href="index.html" aria-label="Voltar">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </span>
        ManagerReplay
      </div>
    </header>

    <h1 class="page-title">
      <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      Quem está gravando
    </h1>
    <p class="subtitle">Atualiza a cada 3s.</p>

    <div id="content"></div>

  </div>

  <script>
    const contentEl = document.getElementById("content");
    const STALE_THRESHOLD_SECONDS = 30;

    const ICON_CAMERA = '<svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>';

    const QUALITY_LABELS = {
      hd30: "HD · 30fps",
      hd60: "HD · 60fps",
      fhd30: "FHD · 30fps",
      fhd60: "FHD · 60fps",
      uhd30: "4K · 30fps",
      uhd60: "4K · 60fps",
    };

    // Câmera 1 sempre grava com facingMode "environment" (traseira) e a
    // câmera 2 com "user" (frontal) — combinação fixada em cameras.html.
    const CAMERA_LABELS = {
      1: "Câmera traseira",
      2: "Câmera frontal",
    };

    function cameraLabel(cameraId) {
      return CAMERA_LABELS[cameraId] || `Câmera ${cameraId}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[ch]);
    }

    function formatElapsed(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function signalIndicator(session) {
      if (session.seconds_since_last_chunk === null) {
        return `<span class="signal ok"><span class="dot"></span>aguardando primeiro envio</span>`;
      }
      if (session.seconds_since_last_chunk >= STALE_THRESHOLD_SECONDS) {
        return `<span class="signal bad"><span class="dot"></span>sem sinal há ${session.seconds_since_last_chunk}s</span>`;
      }
      return `<span class="signal ok"><span class="dot"></span>enviando</span>`;
    }

    function renderCard(session) {
      const name = session.name || "(sem nome)";
      const quality = QUALITY_LABELS[session.quality] || session.quality || "—";
      return `
        <div class="card rec-card">
          <div class="card-top">
            <span class="card-name">${escapeHtml(name)}</span>
            <span class="card-camera">${ICON_CAMERA} ${escapeHtml(cameraLabel(session.camera))}</span>
          </div>
          <div class="card-elapsed">${formatElapsed(session.elapsed_seconds)}</div>
          <div class="card-meta">
            <span>${quality} · ${formatBytes(session.bytes_received)} enviados</span>
            ${signalIndicator(session)}
          </div>
        </div>
      `;
    }

    function render(sessions) {
      if (sessions.length === 0) {
        contentEl.innerHTML = '<div id="empty">Ninguém gravando agora.</div>';
        return;
      }
      contentEl.innerHTML = sessions.map(renderCard).join("");
    }

    async function poll() {
      try {
        const response = await fetch("/recording-status");
        if (!response.ok) throw new Error("não foi possível ler o status");
        const sessions = await response.json();
        render(sessions);
      } catch (err) {
        contentEl.innerHTML = `<div id="empty">erro: ${escapeHtml(err.message)}</div>`;
      }
    }

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
