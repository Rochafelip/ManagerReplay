<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ManagerReplay — Câmeras</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    label .icon { color: var(--accent); }

    #name-input {
      display: block;
      width: 100%;
      padding: 14px 15px;
      font-size: 1.05rem;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
    }
    #name-input::placeholder { color: var(--text-muted); font-weight: 500; }
    #name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    #camera-step {
      margin-top: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.25s ease;
    }
    #camera-step.visible { margin-top: 26px; opacity: 1; max-height: 600px; }

    .camera-slot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .camera-slot.slot-busy { opacity: 0.55; background: var(--card-bg-muted, #f1f5f9); }
    .camera-slot.slot-busy .camera-link-icon { background: #e2e8f0; color: var(--text-muted); }
    .camera-link-icon {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-slot-body { min-width: 0; flex: 1; }
    .camera-link-title { font-size: 1rem; font-weight: 800; margin-bottom: 8px; }
    .camera-slot-busy-label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .lens-buttons { display: flex; gap: 8px; }
    a.lens-btn {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: transform 0.12s ease;
    }
    a.lens-btn:active { transform: scale(0.97); }
    .camera-slot.slot-busy .lens-buttons { display: none; }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="icon-button" href="index.html" aria-label="Voltar">
        <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <div class="brand">
        <span class="brand-mark">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </span>
        ManagerReplay
      </div>
    </header>

    <h1 class="page-title">Quem vai gravar?</h1>
    <p class="subtitle">Informe seu nome pra liberar a escolha de câmera.</p>

    <label for="name-input">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Seu nome
    </label>
    <input id="name-input" type="text" placeholder="Ex: Carlos" autocomplete="off" />

    <div id="camera-step">
      <label>
        <svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Qual câmera você vai usar?
      </label>
      <div id="camera-links"></div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "managerreplay_operator_name";
    const SLOTS = [
      { id: 1, label: "Gol" },
      { id: 2, label: "Lateral Esquerda" },
      { id: 3, label: "Lateral Direita" },
      { id: 4, label: "Geral" },
    ];
    const POLL_INTERVAL_MS = 3000;

    const nameInput = document.getElementById("name-input");
    const cameraStep = document.getElementById("camera-step");
    const cameraLinksEl = document.getElementById("camera-links");

    const cameraSlots = {};
    SLOTS.forEach((slot) => {
      const card = document.createElement("div");
      card.className = "camera-slot";
      card.id = `camera-${slot.id}-slot`;
      card.innerHTML = `
        <span class="camera-link-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
        <span class="camera-slot-body">
          <span class="camera-link-title">${slot.label}</span>
          <span class="camera-slot-busy-label" hidden>Em uso</span>
          <span class="lens-buttons">
            <a class="lens-btn" data-facing="environment" href="#">Câmera Traseira</a>
            <a class="lens-btn" data-facing="user" href="#">Câmera Frontal</a>
          </span>
        </span>
      `;
      cameraLinksEl.appendChild(card);
      cameraSlots[slot.id] = {
        card,
        busyLabel: card.querySelector(".camera-slot-busy-label"),
        lensButtons: card.querySelectorAll("a.lens-btn"),
      };
    });

    function updateLinks(name) {
      const encoded = encodeURIComponent(name.trim());
      SLOTS.forEach((slot) => {
        cameraSlots[slot.id].lensButtons.forEach((btn) => {
          btn.href = `capture.html?mode=chunks&camera=${slot.id}&facing=${btn.dataset.facing}&name=${encoded}`;
        });
      });
    }

    let pollTimer = null;

    async function refreshBusySlots() {
      let busyCameraIds = [];
      try {
        const res = await fetch("/recording-status");
        const sessions = await res.json();
        busyCameraIds = sessions.map((s) => s.camera);
      } catch (err) {
        // Falha de rede no poll: assume "nenhum slot ocupado conhecido" em
        // vez de travar a escolha — o backend continua sendo a fonte da
        // verdade por camera_id de qualquer forma.
        busyCameraIds = [];
      }
      SLOTS.forEach((slot) => {
        const { card, busyLabel } = cameraSlots[slot.id];
        const busy = busyCameraIds.includes(slot.id);
        card.classList.toggle("slot-busy", busy);
        busyLabel.hidden = !busy;
      });
    }

    function startPolling() {
      if (pollTimer) return;
      refreshBusySlots();
      pollTimer = setInterval(refreshBusySlots, POLL_INTERVAL_MS);
    }

    function stopPolling() {
      clearInterval(pollTimer);
      pollTimer = null;
    }

    function onNameChange() {
      const name = nameInput.value.trim();
      const visible = name.length > 0;
      cameraStep.classList.toggle("visible", visible);
      if (visible) {
        updateLinks(name);
        localStorage.setItem(STORAGE_KEY, name);
        startPolling();
      } else {
        stopPolling();
      }
    }

    nameInput.addEventListener("input", onNameChange);

    // Melhor esforço pra sugerir o nome com o modelo do celular (só Android
    // expõe isso no user agent de forma confiável; iOS não identifica o
    // modelo exato). O campo continua editável normalmente.
    function guessDeviceModel() {
      const ua = navigator.userAgent;
      const androidMatch = ua.match(/Android [^;]+;\s*([^;]+?)\s*(Build|\))/);
      if (androidMatch) return androidMatch[1].trim();
      if (/iPad/.test(ua)) return "iPad";
      if (/iPhone/.test(ua)) return "iPhone";
      return "";
    }

    const savedName = localStorage.getItem(STORAGE_KEY);
    if (savedName) {
      nameInput.value = savedName;
      onNameChange();
    } else {
      const guessed = guessDeviceModel();
      if (guessed) {
        nameInput.value = guessed;
        onNameChange();
      }
    }
  </script>
</body>
</html>
