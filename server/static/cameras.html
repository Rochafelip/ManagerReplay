<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ManagerReplay</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #0b0f14; color-scheme: dark; }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 18px max(18px, env(safe-area-inset-left));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f14;
      color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
    .subtitle { color: #6b7280; font-size: 0.85rem; margin: 0 0 24px; }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    #name-input {
      display: block;
      width: 100%;
      padding: 14px 15px;
      font-size: 1.05rem;
      font-weight: 600;
      background: #111720;
      border: 1px solid #202833;
      color: #f3f4f6;
      border-radius: 12px;
    }
    #name-input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15); }
    #camera-step {
      margin-top: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.25s ease;
    }
    #camera-step.visible { margin-top: 26px; opacity: 1; max-height: 300px; }
    a.camera-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 16px;
      margin-bottom: 10px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 1.02rem;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    a.camera-link:active { background: #15803d; }
  </style>
</head>
<body>
  <h1>ManagerReplay</h1>
  <p class="subtitle">Quem vai gravar?</p>

  <label for="name-input">Seu nome</label>
  <input id="name-input" type="text" placeholder="Ex: Carlos" autocomplete="off" />

  <div id="camera-step">
    <label>Qual câmera você vai usar?</label>
    <a class="camera-link" id="camera-1-link" href="#">📹 Câmera 1 — Traseira</a>
    <a class="camera-link" id="camera-2-link" href="#">📹 Câmera 2 — Frontal</a>
  </div>

  <script>
    const STORAGE_KEY = "managerreplay_operator_name";
    const nameInput = document.getElementById("name-input");
    const cameraStep = document.getElementById("camera-step");
    const cameraLinks = {
      1: document.getElementById("camera-1-link"),
      2: document.getElementById("camera-2-link"),
    };

    function updateLinks(name) {
      const encoded = encodeURIComponent(name.trim());
      cameraLinks[1].href = `capture.html?mode=chunks&camera=1&facing=environment&name=${encoded}`;
      cameraLinks[2].href = `capture.html?mode=chunks&camera=2&facing=user&name=${encoded}`;
    }

    function onNameChange() {
      const name = nameInput.value.trim();
      cameraStep.classList.toggle("visible", name.length > 0);
      if (name.length > 0) {
        updateLinks(name);
        localStorage.setItem(STORAGE_KEY, name);
      }
    }

    nameInput.addEventListener("input", onNameChange);

    const savedName = localStorage.getItem(STORAGE_KEY);
    if (savedName) {
      nameInput.value = savedName;
      onNameChange();
    }
  </script>
</body>
</html>
