<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ManagerReplay Spike 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 1em;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 0.75em;
    }
    .rec-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #dc2626;
      animation: pulse 1.2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: 1.1em; margin: 0; }
    #video-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
    }
    .info-box {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 0.75em 1em;
      margin-top: 0.75em;
      font-size: 0.95em;
      line-height: 1.6;
    }
    #save-path { font-size: 0.8em; color: #999; word-break: break-all; }
    #status { color: #4ade80; font-weight: 600; }
    select {
      width: 100%;
      padding: 1em;
      margin-top: 0.75em;
      font-size: 1.1em;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
    }
    a.back-link {
      display: inline-block;
      margin-top: 0.75em;
      color: #93c5fd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <span class="rec-dot"></span>
    <h1>Câmera <span id="camera-label"></span> · modo <span id="mode-label"></span></h1>
  </header>
  <div id="video-wrap">
    <video id="preview" autoplay playsinline muted></video>
  </div>
  <div class="info-box">
    <div id="status">iniciando...</div>
    <div id="stats"></div>
    <div id="save-path"></div>
  </div>
  <select id="camera-device"></select>
  <a class="back-link" href="cameras.html">&larr; voltar ao menu</a>
  <script src="client.js?v=5"></script>
</body>
</html>
