# Drop-in for NetworkManager's dnsmasq instance used by the
# "HighlightBox-Test" shared (ipv4.method shared) hotspot connection.
#
# Install on the Pi at:
#   /etc/NetworkManager/dnsmasq-shared.d/captive.conf
#
# Makes every DNS name (including Android/iOS/Windows captive-portal
# probe domains such as connectivitycheck.gstatic.com, captive.apple.com,
# msftconnecttest.com) resolve to the Pi's hotspot IP, so the redirect
# server on port 80 (managerreplay-captive.service) is what answers them.
#
# Apply by restarting the hotspot connection:
#   sudo nmcli connection down HighlightBox-Test && sudo nmcli connection up HighlightBox-Test

address=/#/10.42.0.1
